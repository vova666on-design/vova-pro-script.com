<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScriptVault — общая библиотека скриптов Roblox и Delta</title>
<style>
:root{--bg:#0a0a0b;--card:#17100fcc;--card2:#241716;--line:#ffffff14;--tx:#f4eeee;--mu:#a08f8f;--ac:#e11d2e;--ac2:#ff6a3d;--ok:#3ddc97;--code:#0c0809;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#fbf3f3;--card:#ffffffd9;--card2:#f6e4e4;--line:#0000001a;--tx:#1a0d0e;--mu:#7a5a5c;--code:#1a0d0e}
:root[data-theme="dark"]{--bg:#0a0a0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;min-height:100vh}
body:before,body:after{content:"";position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:drift 18s ease-in-out infinite alternate}
body:before{background:var(--ac);top:-25vmax;left:-15vmax}body:after{background:var(--ac2);bottom:-30vmax;right:-20vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
nav{position:sticky;top:0;z-index:10;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:12px;height:62px}
